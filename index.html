<style>
:root{
  --ink:#1d2433; --muted:#5f6779; --paper:#fbf8f2; --card:#ffffff;
  --navy:#1f3a5f; --red:#c8423b; --gold:#b98b2e; --line:#e7e0d3; --soft:#f2ece1;
  --play:#2f7d5b; --food:#c8423b; --sight:#1f3a5f; --move:#8a8f9c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
a{color:var(--navy)}
header{padding:22px 18px 10px;max-width:760px;margin:0 auto}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:28px;line-height:1.15;margin:0 0 6px}
h1 span{color:var(--red)}
.sub{color:var(--muted);margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 60px}
.tabs{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;gap:6px;padding:10px 12px;max-width:760px;margin:0 auto;border-bottom:1px solid var(--line)}
.tabs{overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;min-width:64px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;font:600 13.5px Inter;color:var(--ink);cursor:pointer;min-width:0}
.tab small{display:block;font-weight:400;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.tab[aria-selected=true] small{color:#d6deea}
.day{display:none}.day.on{display:block}
.summary{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:16px 0}
.summary h2{font-family:Fraunces,serif;font-size:21px;margin:0 0 4px}
.summary p{margin:4px 0;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--soft);border-radius:999px;padding:3px 10px;font-size:12.5px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:600 13.5px Inter;border-radius:10px;padding:8px 12px;border:1px solid var(--navy);color:var(--navy);background:#fff;cursor:pointer}
.btn.primary{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn svg{width:16px;height:16px}
.map{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;margin:0 0 16px}
.map > .lmap > svg{width:100%;height:auto;display:block}
.leaflet-attribution-flag{display:none!important}
.lmap{height:340px;border-radius:12px;overflow:hidden;position:relative;z-index:0}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);color:#fff;font:700 13px Inter}
.leaflet-popup-content{font:14px Inter;margin:10px 12px}
.leaflet-popup-content b{display:block;margin-bottom:6px}
.pop-btn{display:inline-block;background:#1f3a5f;color:#fff!important;text-decoration:none;font-weight:600;border-radius:8px;padding:6px 10px;margin-right:4px}
.locate{position:absolute;right:10px;bottom:22px;z-index:500;background:#fff;border:0;border-radius:10px;box-shadow:0 1px 5px rgba(0,0,0,.3);padding:8px 10px;font:600 13px Inter;color:#1f3a5f;cursor:pointer}
.me{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.map .cap{font-size:12px;color:var(--muted);padding:2px 6px 4px}
.timeline{position:relative;margin:0;padding:0;list-style:none}
.timeline:before{content:"";position:absolute;left:21px;top:8px;bottom:8px;width:2px;background:var(--line)}
.stop{position:relative;padding-left:52px;margin-bottom:14px}
.dot{position:absolute;left:8px;top:14px;width:28px;height:28px;border-radius:50%;color:#fff;font:700 13px Inter;display:flex;align-items:center;justify-content:center;border:3px solid var(--paper)}
.sight .dot{background:var(--sight)} .food .dot{background:var(--food)} .play .dot{background:var(--play)} .move .dot{background:var(--move)} .home .dot{background:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.move .card{background:transparent;border-style:dashed}
.time{font:600 12.5px Inter;color:var(--red);letter-spacing:.02em}
.where{font:500 12px Inter;color:var(--muted)}
.card h3{margin:2px 0 4px;font-size:16.5px}
.card p{margin:6px 0;color:#384052}
.tip{font-size:13.5px;background:var(--soft);border-radius:10px;padding:7px 10px;margin-top:8px}
.kids{font-size:13.5px;background:#e9f3ee;border-radius:10px;padding:7px 10px;margin-top:8px}
details.story{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
details.story summary{cursor:pointer;font:600 13.5px Inter;color:var(--gold);list-style:none}
details.story summary::-webkit-details-marker{display:none}
details.story summary:before{content:"▸ ";}
details.story[open] summary:before{content:"▾ ";}
details.story p{font-size:14px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.tag.book{background:#fde7e4;color:#9b2c25}.tag.free{background:#e3f2ea;color:#22603f}.tag.kid{background:#e6edf7;color:#1f3a5f}.tag.nap{background:#f4ead2;color:#7a5a17}.tag.opt{background:#eee;color:#555}
.done-toggle{float:right;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
.stop.done .card{opacity:.5}
.now .card{outline:2px solid var(--gold)}
section.info{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:16px 0}
section.info h2{font-family:Fraunces,serif;font-size:20px;margin:0 0 6px}
section.info ul{margin:6px 0;padding-left:18px}
section.info li{margin:5px 0}
.floors{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;font-size:12.5px}
.floors div{background:var(--soft);border-radius:10px;padding:8px}
.floors b{display:block;color:var(--navy)}

.btn.stk{background:#fff4d6;border-color:#e2b34a;color:#7a5a17}
.btn.stk.got{background:#e3f2ea;border-color:#7cc29b;color:#22603f}
.modal{position:fixed;inset:0;background:rgba(20,25,40,.55);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.mbox{background:#fffdf8;border-radius:22px;max-width:380px;width:100%;padding:22px 20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .35s ease}
.mbox .big{font-size:84px;line-height:1;margin:4px 0 6px;display:inline-block;animation:bob 1.6s ease-in-out infinite}
.mbox h3{font-family:Fraunces,serif;font-size:22px;margin:4px 0}
.mbox .mission{font-size:17px;background:#fff4d6;border-radius:14px;padding:12px;margin:12px 0}
.mbox .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bigbtn{font:700 17px Inter;border:0;border-radius:14px;padding:12px 18px;cursor:pointer}
.bigbtn.yes{background:#2f7d5b;color:#fff}.bigbtn.no{background:#eee;color:#444}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.confetti{position:fixed;top:-40px;z-index:1100;pointer-events:none;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.hero{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#1f3a5f,#3b2e5a);color:#fff;border-radius:18px;padding:14px;margin:16px 0}
.hero .pigeon{font-size:54px;animation:bob 2s ease-in-out infinite;cursor:pointer}
.bubble{background:#fff;color:#1d2433;border-radius:14px;padding:10px 12px;font-size:14px;position:relative;flex:1}
.bubble:before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.level{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
.level .lv{font:700 18px Fraunces,serif}
.bar{height:16px;background:#f0e8d8;border-radius:99px;overflow:hidden;margin-top:8px}
.bar div{height:100%;background:linear-gradient(90deg,#e2b34a,#c8423b);border-radius:99px;transition:width .6s}
.book{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 12px 6px;margin:12px 0}
.book h2{font-family:Fraunces,serif;font-size:19px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.sticker{border-radius:16px;padding:10px 4px;text-align:center;font-size:11.5px;font-weight:600;min-height:104px;cursor:pointer;border:2px dashed #d9cfbd;background:#faf6ee;color:#a49a88}
.sticker .e{font-size:42px;display:block;line-height:1.2;filter:grayscale(1) opacity(.25)}
.sticker.got{border:3px solid #fff;background:radial-gradient(circle at 30% 25%,#fff8e1,#ffe3a3);color:#5a4210;box-shadow:0 3px 10px rgba(185,139,46,.35);transform:rotate(-2deg)}
.sticker.got:nth-child(even){transform:rotate(2deg)}
.sticker.got .e{filter:none}
.sticker.got:active{animation:wiggle .4s}
.bingo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bingo button{aspect-ratio:1;border-radius:16px;border:2px solid #e7e0d3;background:#fff;font-size:36px;cursor:pointer;position:relative}
.bingo button small{display:block;font:600 11px Inter;color:#5f6779}
.bingo button.hit{background:#e3f2ea;border-color:#2f7d5b}
.bingo button.hit:after{content:"✓";position:absolute;top:4px;right:8px;font:800 18px Inter;color:#2f7d5b}
.reset{background:none;border:0;color:#a49a88;font-size:12px;text-decoration:underline;cursor:pointer;margin:6px 0}
.tbtns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.tbtn{font:600 13px Inter;border-radius:999px;padding:6px 11px;border:1px solid #cfc6b4;background:#fff;color:#1d2433;cursor:pointer}
.tbtn.go{background:#1f3a5f;border-color:#1f3a5f;color:#fff}
.tbtn.on{background:#e3f2ea;border-color:#7cc29b;color:#22603f}
.tbtn.ghost{color:#8a8f9c;border-style:dashed}
.time .plan{color:#a49a88;font-weight:500}
.time .late{color:#c8423b}.time .early{color:#2f7d5b}.time .ok{color:#2f7d5b}.time .skipped{color:#8a8f9c}
.warn{font-size:13px;background:#fde7e4;color:#8c2a23;border-radius:10px;padding:6px 10px;margin:6px 0}
.stop.skip .card{opacity:.45}
.bn{background:#fff;border:2px solid #e2b34a;border-radius:14px;padding:10px 14px;margin:0 0 14px;font-size:14.5px}
.bn.bad{border-color:#c8423b}
.bn ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:#8c2a23}
.banner:empty{display:none}
.langs{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
.lang{font:600 12.5px Inter;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--ink)}
.lang.on{background:var(--navy);color:#fff;border-color:var(--navy)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:10px}
</style>
</head>

 infoSat:`<section class="info"><h2>Saturday: Chantilly by train</h2><ul><li><b>Trains:</b> Paris Gare du Nord → Chantilly-Gouvieux. The TER regional train takes about 25 min and the RER D about 45 min. Buy tickets in the SNCF Connect app or at the station, because Metro/Navigo tickets don't cover Chantilly. Children under 4 travel free.</li><li><b>Lunch:</b> La Capitainerie, Saturday 13:00, table for 5, TheFork booking no. 1683270789. Restaurant phone: +33 6 11 07 01 56.</li><li><b>Winter hours:</b> château 10:00–17:00, park 10:00–18:00, Great Stables 12:00–17:00 (closed Tuesdays). One Domaine ticket covers all three; children under 7 get into the château free.</li></ul></section>`,

    <section class="info">
      <h2>Weather</h2>
      <p>Dry both days, but cold: Thursday about 2 → 10 °C, and Friday starts below freezing (−1 °C) and reaches about 10 °C. Bring hats, gloves and a stroller rain/wind cover. It gets dark about 17:15.</p>
    </section>

      <ul>
        <li><b>Your stations:</b> Picpus and Bel-Air (line 6) are a few minutes' walk away; Nation (lines 1, 2, 6, 9, RER A) is a bit further and has a direct line 1 to the Louvre.</li>

        <li><b>Tickets:</b> children under 4 ride free; your 4½-year-old needs a reduced (child) fare. Buy tickets in the official Île-de-France Mobilités / Bonjour RATP app or at station machines.</li>

        <li><b>Breizh Café Odéon</b> (Thu lunch, optional), <b>Le Picotin</b> (Thu dinner), <b>Café Marly</b> (Fri lunch), <b>Le Square Trousseau</b> (Fri dinner): tap "Map" for each place's phone and booking link. Ask for a high chair and room for a stroller.</li>
        <li><b>Seine cruise</b>: <a href="https://www.bateauxparisiens.com/">Bateaux Parisiens</a> 1-hour sightseeing cruise. Departure times change by season, so check Thursday's times and aim for about 16:30–17:00.</li>

        <li><b>Trocadéro terrace</b>: the classic full-tower shot. Go to the left or right edge of the terrace for fewer people in the frame.</li>

        <li><b>From the boat</b>: the cruise ends below the tower around dusk, when the golden lights come on. The tower sparkles for 5 minutes on the hour after dark, so the first sparkle should be at 18:00.</li>
      </ul>

      <h2>A story thread for the kids</h2>

    </section>
`

const DAYS = {
 thu:{
  title:"Thursday · The classic sights",
  blurb:"Île de la Cité in the morning, lunch on the Left Bank, a playground and nap in the Luxembourg Gardens, then the Eiffel Tower and a Seine cruise at sunset.",
  chips:["≈ 9:30 → 19:00","Dry, 2–10 °C","Lunch: crêpes, Breizh Café","Dinner: Le Picotin"],
  stops:[
   {t:"09:30",k:"home",p:HOME,h:"Leave home",d:"Head to Notre-Dame: about 30–35 min by Metro (line 1 from Nation to Hôtel de Ville) or a step-free bus. Tap Directions and pick whichever suits the stroller."},
   {t:"10:10",k:"sight",p:P.nd,h:"Notre-Dame de Paris",tags:["free","book"],
    d:"Paris's great Gothic cathedral, begun in 1163 and newly restored after the 2019 fire. The inside is brighter than it has been in centuries: cream-coloured stone, gleaming gold, and three huge rose windows of 13th-century glass. Plan on about 45 minutes. Walk the full loop round the choir, then go out and round the back to see the flying buttresses (the stone 'arms' holding the walls up) and the rebuilt spire.",
    kids:"In the square in front, find the bronze star in the ground called <b>Point Zéro</b>. All road distances in France are measured from it, and legend says anyone who stands on it will come back to Paris. Outside, count the gargoyles and chimeras (stone monsters) along the roofline.",
    tip:"Bags over 40×30×20 cm aren't allowed, so bring a small bag. A free timed slot is optional in November but saves queuing.",
    story:`<p><b>Napoleon crowns himself (2 December 1804).</b> Napoleon brought Pope Pius VII from Rome for the coronation, and then, at the key moment, took the crown and put it on his own head before crowning Joséphine. After the Revolution the cathedral was in such a bad state (it had been turned into a "Temple of Reason" and used as a store) that the damaged walls were hidden behind drapes for the ceremony. You'll see David's giant painting of this scene at the Louvre on Friday.</p>
    <p><b>Saved by a novel.</b> By the 1830s the building was close to ruin. Victor Hugo's <i>The Hunchback of Notre-Dame</i> (1831) made Parisians fall back in love with it, and the architect Viollet-le-Duc then restored it, adding the spire and many of the monsters on the roof.</p>
    <p><b>Liberation night (24 August 1944).</b> When the first Free French tanks reached the Hôtel de Ville, the cathedral's great bell Emmanuel rang out for the first time in four years of occupation. The bells of other churches joined in, and all of Paris knew the city was being freed. Two days later General de Gaulle came for a thanksgiving service, and shots were fired inside the cathedral, but he kept walking down the aisle.</p>`},
   {t:"11:10",k:"sight",p:P.isl,h:"Île Saint-Louis & the quays",tags:["kid"],
    d:"Cross the little Pont Saint-Louis behind Notre-Dame onto the city's quietest island. It's a single 17th-century neighbourhood of honey-coloured townhouses, cobbled side streets and small shops. Stroll the Rue Saint-Louis-en-l'Île and get a <b>Berthillon</b> ice cream (Paris's most famous, made here since 1954) or a hot chocolate. Then walk out onto <b>Pont de la Tournelle</b> for the best photo of Notre-Dame from behind.",
    kids:"On Pont de la Tournelle a tall statue of <b>Sainte Geneviève</b>, the patron saint of Paris, faces the city. The story goes that she saved Paris from Attila the Hun by getting everyone to pray instead of running away.",
    tip:"Flat and quiet, so this works well if the 4½-year-old wants to walk.",
    story:`<p>Until the 1600s this was two swampy islets used for grazing cows and fighting duels. In 1614 developers joined them together, built quays and bridges, and laid out a planned luxury district, one of the first in Europe. It has barely changed since, which is why it feels like a village.</p>`},
   {t:"12:15",k:"food",p:P.breizh,h:"Lunch · Breizh Café Odéon (crêpes)",tags:["kid"],
    d:"A quick, easy French lunch: crêpes from Brittany at the Carrefour de l'Odéon, about 20 min on foot from Île Saint-Louis along the Seine and 5 min from the Luxembourg Gardens. Start with a savoury buckwheat <b>galette</b> (try a 'complète': ham, cheese and egg), then a sweet <b>crêpe</b> with butter and sugar or chocolate. Traditionally you drink cider from a bowl; for the kids, apple juice. The service is quick and there's a set lunch menu on weekdays.",
    kids:"Watch the crêpes being made on the big round hot plates! A galette is brown (buckwheat) and salty, and a crêpe is golden and sweet.",
    tip:"Phone +33 1 42 49 34 73 for 12:00 and ask for « une chaise haute ». Arriving right at noon beats the lunch rush.",
    story:`<p><b>Napoleon's hat is round the corner.</b> Le Procope, Paris's oldest café (1686), is a 2-minute walk away on Rue de l'Ancienne Comédie. Voltaire and Benjamin Franklin drank coffee there, and as a penniless young officer Napoleon is said to have left his hat as security for a bill he couldn't pay. A hat said to be his is displayed in the window area, so peek in on your way past.</p>
    <p><b>Crêpes and Paris.</b> Galettes come from Brittany, where buckwheat grew well on poor soil. Thousands of Bretons moved to Paris in the 1800s and settled around the Montparnasse station, where trains from Brittany arrived, which is why Paris has so many crêperies.</p>`},
   {t:"13:45",k:"play",p:P.lux,h:"Jardin du Luxembourg · nap stroll + playground",tags:["kid","nap"],
    d:"An 8-minute walk. This is Paris's favourite garden: an Italian-style palace, a big octagonal pond, avenues of chestnut trees and about a hundred statues. Do a slow loop past the palace and pond so the little one can nap in the stroller. Then go to the playground in the southwest corner (small fee, about €3 per child aged 3+, €1 per adult), one of the best in Paris, with a separate fenced area for toddlers.",
    kids:"Look for the small <b>Statue of Liberty</b> in the west part of the garden. It's a copy by the same sculptor as the one in New York.",
    tip:"The garden closes at about 17:00 in November, which is plenty of time.",
    story:`<p><b>A homesick queen.</b> Marie de Médicis, widow of Henri IV, built the palace from 1612 to remind her of the Pitti Palace in her home city of Florence.</p>
    <p><b>Revolution and Napoleon.</b> During the Terror the palace was a prison. The painter Jacques-Louis David was held here and sketched the garden from his window (he later painted Napoleon's coronation). In 1799 Napoleon made the palace the home of the Senate, which still meets here.</p>
    <p><b>World War II.</b> During the occupation the palace was the headquarters of the German air force (Luftwaffe) for Western Europe, and the Germans dug bunkers beneath it. On 25 August 1944 it was one of the last German strongholds in Paris and was retaken after fierce fighting by the Resistance and Leclerc's division.</p>`},
   {t:"15:15",k:"move",p:P.troc,h:"Travel to Trocadéro (≈30 min)",d:"By RER or Metro, or a bus if the toddler is still asleep. Google Maps will pick the fastest route."},
   {t:"15:50",k:"sight",p:P.troc,h:"Eiffel Tower photo · Trocadéro",tags:["free"],
    d:"The classic full-tower view: from the terrace between the two curved wings of the Palais de Chaillot, the gardens and fountains drop down to the Seine with the tower right across the river. Late-afternoon light is good. Take the photo, then walk down through the gardens and across Pont d'Iéna to the foot of the tower (about 10 min).",
    kids:"Stand under the tower and look straight up through the middle. It's 330 m tall and made of 18,000 iron pieces held together by 2.5 million rivets.",
    tip:"For a second shot, Pont de Bir-Hakeim is 10 min upriver, with the tower framed by iron arches.",
    story:`<p><b>Hitler's photo (23 June 1940).</b> A week after German troops entered Paris, Hitler made his only visit to the city, a three-hour tour at dawn. The most famous photo of it was taken right here on this terrace, with the tower behind him. Legend says the French had sabotaged the tower's lifts so he would have to climb, and he never went up, giving rise to the saying that Hitler conquered France but not the Eiffel Tower.</p>
    <p><b>Human rights.</b> In 1948 the United Nations adopted the Universal Declaration of Human Rights in this palace, which is why the terrace is called the Parvis des Droits de l'Homme ("Square of Human Rights").</p>
    <p><b>The tower that wasn't meant to stay.</b> It was built for the 1889 World's Fair, marking 100 years since the Revolution, with a permit for just 20 years. Many artists called it an eyesore. Radio saved it: in World War I its giant antenna intercepted German military messages, including some that helped unmask the spy Mata Hari.</p>`},
   {t:"16:30",k:"sight",p:P.bateaux,h:"Seine cruise · Bateaux Parisiens",tags:["book","kid"],
    d:"A 1-hour glass-covered boat trip past almost every landmark: the Grand Palais, the golden statues of Pont Alexandre III, the Louvre, the Musée d'Orsay (a former railway station), Notre-Dame and the islands, then back to the tower. The kids sit down, it's warm, and there are toilets on board. Take the departure nearest 16:30–17:00 so you sail into sunset (about 17:10).",
    kids:"At <b>Pont de l'Alma</b>, look for the stone soldier (the Zouave) on the bridge pillar. Parisians judge floods by how high the water comes up on him: in the great flood of 1910 it reached his chin.",
    tip:"If you return around 18:00, stay by the tower: the first sparkle (5 min on the hour) should be at 18:00.",
    story:`<p><b>Pont Neuf</b> means "New Bridge", but it's the oldest bridge in Paris (finished in 1607). <b>Pont Alexandre III</b> was a gift of friendship from Russia's tsar for the 1900 World's Fair. The <b>Musée d'Orsay</b> was a railway station; in 1945 returning prisoners of war and concentration-camp survivors were received there.</p>`},
   {t:"18:10",k:"move",p:P.bir,h:"Home on line 6 (≈35 min)",d:"From Bir-Hakeim, line 6 runs straight to Picpus or Bel-Air with no changes. Sit on the right-hand side heading east for views of the tower as the train crosses the Seine.",
    story:`<p><b>Why "Bir-Hakeim"?</b> The bridge and station are named after a 1942 battle in the Libyan desert, where about 3,700 Free French soldiers held off Rommel's much larger army for 16 days. It was a big boost for de Gaulle's Free France.</p>
    <p>Near the station a memorial marks the <b>Vel d'Hiv</b>, a cycling stadium where, in July 1942, French police held more than 13,000 Jews, including thousands of children, before they were deported.</p>`},
   {t:"19:30",k:"food",p:P.picotin,h:"Dinner · Le Picotin (near home)",tags:["book"],
    d:"A cosy, rustic French bistro on Rue Sibuet, a few minutes from your door. Everything is fresh and home-cooked, and it's popular with local families. Thursday dinner seems to start at 19:30, so book.",
    tip:"If the kids are fading, ask whether you can take dishes home, or save Le Picotin for Friday.",
    story:`<p><b>Your own neighbourhood's history.</b> Place de la Nation was once called the "Place du Trône", after the throne set up there in 1660 when Louis XIV and his new queen entered Paris. In summer 1794, at the height of the Terror, the guillotine stood there, and more than 1,300 people were executed in six weeks. Their bodies were buried in pits in a convent garden on Rue de Picpus, now the small private <b>Picpus Cemetery</b>, a few minutes' walk from your flat.</p>
    <p>The Marquis de <b>Lafayette</b>, hero of the American Revolution, chose to be buried there next to his wife, under soil brought from Bunker Hill. An American flag flies over his grave and kept flying throughout the German occupation. On 4 July 1917 an American officer stood at the grave and declared, "Lafayette, we are here!" The cemetery opens only for a couple of hours on some winter afternoons, so check before you go.</p>`}
  ]},
 fri:{
  title:"Friday · Louvre, gardens & Père Lachaise",
  blurb:"Your 10:00 Louvre slot, lunch overlooking the Pyramid, the Tuileries playground and a nap stroll to Concorde, then the atmospheric Père Lachaise cemetery, which is close to home.",
  chips:["≈ 9:15 → 17:45","Cold morning, dry","Lunch: Café Marly","Dinner: Le Square Trousseau"],
  stops:[
   {t:"09:15",k:"home",p:HOME,h:"Leave home",d:"Walk or take a bus to Nation, then line 1 straight to Palais Royal–Musée du Louvre (about 20 min, no changes). Allow time for the security queue before 10:00."},
   {t:"10:00",k:"sight",p:P.louvre,h:"Louvre",tags:["book","kid"],louvre:true,
    d:"A castle, then a royal palace, then the world's largest art museum. With small kids, follow the route in the <b>Louvre tab</b>: a real medieval castle, a giant sphinx and a walk-in tomb, the Venus de Milo, the Winged Victory, the Mona Lisa, and Napoleon's coronation. About 2–2½ hours.",
    tip:"Strollers are allowed and lifts link the floors. On Fridays the second floor (level 2) opens only at 10:30, but this route doesn't use it.",
    story:`<p>King Philippe Auguste built the Louvre around 1190 as a fortress to guard Paris while he was away on crusade. It became a royal palace, and after Louis XIV moved the court to Versailles it filled with artists. The Revolution opened it as a public museum in 1793. Napoleon renamed it the "Musée Napoléon" and filled it with art taken from the countries he conquered; much of it was returned after his defeat in 1815.</p>`},
   {t:"12:30",k:"food",p:P.marly,h:"Lunch · Café Marly",tags:["book"],
    d:"An elegant classic French restaurant under the arcades of the Louvre's Richelieu wing, with tables looking straight onto I. M. Pei's glass Pyramid. The rooms are velvet and gilt, with windows onto the sculpture courts. It's pricey, but it's the nice-meal-with-a-view moment of the trip.",
    kids:"Count the glass panes on the Pyramid. A popular myth says there are 666; there are actually 673.",
    tip:"Café Marly is outside the museum's security, so finish your visit first. If you'd rather stay inside, Café Mollien (Denon wing) is the sit-down option.",
    story:`<p>Until 1989 the wing above you housed France's Ministry of Finance. President Mitterrand moved the ministry out so the museum could expand, and the Pyramid opened the same year. Many Parisians hated it at first.</p>`},
   {t:"14:00",k:"play",p:P.tuil,h:"Tuileries · playground & carousel",tags:["kid","free","nap"],
    d:"The royal garden stretching from the Louvre to Place de la Concorde, laid out in 1564 and redesigned in 1664 by Le Nôtre, the gardener of Versailles. The playground and carousel are on the north side, by the Rue de Rivoli. Afterwards, walk slowly down the central path past the statues to the big round pond so the toddler can nap.",
    kids:"At the Louvre end, look at the pink-marble <b>Arc du Carrousel</b>. Napoleon built it for his victories and put four bronze horses taken from St Mark's in Venice on top. After his defeat Venice took them back, and the ones you see now are replacements.",
    tip:"Kiosks along the path sell hot chocolate and crêpes.",
    story:`<p><b>The missing palace.</b> The open space between the two wings of the Louvre was once closed off by the <b>Tuileries Palace</b>. Louis XVI lived there after being brought from Versailles, until a crowd stormed it in 1792. Napoleon then made it his main home, and he hung the <b>Mona Lisa in his bedroom</b>. In 1871 the Paris Commune burned the palace down, and the ruins were cleared away in the 1880s.</p>
    <p><b>World War II spy story.</b> In the small Jeu de Paume museum at the Concorde end of the garden, the Nazis sorted thousands of artworks stolen from Jewish families before shipping them to Germany. A quiet curator, <b>Rose Valland</b>, secretly wrote down where every piece was sent. After the war her notes helped recover tens of thousands of works (her story inspired the film <i>The Monuments Men</i>).</p>`},
   {t:"14:50",k:"sight",p:P.conc,h:"Place de la Concorde",tags:["free"],
    d:"Paris's grandest square, with the obelisk, two fountains of bronze sea creatures, and views straight up the Champs-Élysées to the Arc de Triomphe and across the Seine to the Eiffel Tower. A quick main-sights bonus on the way.",
    kids:"The <b>obelisk</b> is about 3,300 years old: older than the Louvre, Notre-Dame or anything else in Paris. It came from a temple in Luxor, Egypt, and the pictures carved on it are hieroglyphs. The gold tip was added in 1998.",
    story:`<p>Originally named after Louis XV, the square became the "Place de la Révolution", and the guillotine stood here: Louis XVI was executed on 21 January 1793, and Marie Antoinette that October. Afterwards it was renamed "Concorde" (harmony) as a fresh start. Egypt gave the obelisk to France, and it arrived in 1836 after a two-year journey.</p>
    <p>During the occupation, German troops paraded down the Champs-Élysées every day, and the grand buildings on the north side served as German headquarters. On 25 August 1944 Leclerc's tanks fought German forces around this square during the liberation.</p>`},
   {t:"15:10",k:"move",p:P.pl,h:"Travel to Père Lachaise (≈35 min)",d:"Bus 69 runs from the Rue de Rivoli to the 'Roquette–Père-Lachaise' stop by the main gate: no stairs and good views. Or take Metro line 1 and change to line 2 at Nation."},
   {t:"15:45",k:"sight",p:P.pl,h:"Père Lachaise cemetery",tags:["free"],
    d:"The world's most visited cemetery: a hilly, leafy 'city of the dead' with cobbled lanes, moss-covered chapels and about 70,000 tombs, especially beautiful in autumn. Pick up a free map at the entrance and choose a few graves. Near the main gate are <b>Chopin</b> (division 11) and <b>Jim Morrison</b> (6); further up are <b>Oscar Wilde</b> (89, behind glass because of all the lipstick kisses) and <b>Édith Piaf</b> (97).",
    kids:"Make it a treasure hunt: find a tomb shaped like a little house, an angel, an owl, or one of the cemetery's cats.",
    tip:"It closes at 17:30 in winter and dusk comes at about 17:10, so start back by 17:00. The paths are cobbled and sloping, which is bumpy for the stroller.",
    story:`<p><b>Napoleon's cemetery.</b> It opened in 1804, the year of the coronation, as part of Napoleon's reforms moving burials out of the crowded city. At first nobody wanted to be buried so far out, so in a clever bit of marketing the authorities moved the remains of the playwright Molière, the fable writer La Fontaine and the medieval lovers Héloïse and Abélard here. It worked. Several of Napoleon's marshals now lie here too, including Masséna and Marshal Ney, executed in 1815 for siding with him.</p>
    <p><b>The Communards' Wall.</b> In the far eastern corner, on 28 May 1871, the last fighters of the Paris Commune were lined up against this wall and shot. It is still a place of pilgrimage.</p>
    <p><b>World War II.</b> Nearby, a row of powerful memorials remembers the French people deported to Auschwitz, Buchenwald, Ravensbrück and other Nazi camps. Chopin's grave holds his body, but his heart was smuggled home to Warsaw by his sister and rests in a church there.</p>`},
   {t:"17:15",k:"move",p:HOME,h:"Home (≈20 min)",d:"Line 2 from Père-Lachaise or Philippe Auguste to Nation, then a short walk or one stop on line 6. Rest before dinner."},
   {t:"19:00",k:"food",p:P.trous,h:"Dinner · Le Square Trousseau",tags:["book","kid"],
    d:"A belle-époque bistro (zinc bar, mirrors, banquettes) facing a leafy square, 15 min from home. Classic French food and excellent desserts; kids get chalk to draw on the pavement. A lovely last-evening meal.",
    tip:"Book and ask for an early table. Le Picotin is the closer alternative.",
    story:`<p>The square was laid out in 1906 on the site of the old Hospice des Enfants-Trouvés, a hospital for abandoned babies. All around is the Faubourg Saint-Antoine, Paris's old furniture-makers' quarter. On 14 July 1789 its workers marched a few hundred metres west and stormed the Bastille, starting the French Revolution.</p>`}
  ]},
 sat:{
  title:"Saturday · Chantilly: château, park & horses",
  blurb:"A day trip by train to one of France's most beautiful châteaux: a fairy-tale castle on a lake, lunch in its 17th-century kitchens, a nap stroll in Le Nôtre's park, then the grandest horse stables in Europe.",
  chips:["≈ 9:15 → 19:45","Train from Gare du Nord","Lunch: La Capitainerie 13:00","Château 10–17 · Stables 12–17"],
  stops:[
   {t:"09:15",k:"home",p:HOME,h:"Leave home",d:"Metro to Gare du Nord: about 30–35 min (line 2 from Nation to La Chapelle, which connects to Gare du Nord, or line 4/5). With the stroller, the bus may be easier. Tap Directions."},
   {t:"09:20",k:"move",p:P.gdn,h:"To Gare du Nord (≈35 min)",d:"Buy train tickets on the SNCF Connect app or at the regional (TER) machines: Chantilly is outside the Paris transport zone, so a Metro ticket is not valid. Children under 4 travel free; the 4½-year-old needs a child ticket."},
   {t:"10:00",k:"move",p:P.cgs,h:"Train to Chantilly-Gouvieux (≈25 min)",d:"Take a <b>TER</b> regional train (about 25 min, direct). The <b>RER D</b> also goes there but takes about 45 min. Check the departure board for 'Chantilly-Gouvieux'.",
    kids:"Look out of the window: after the city come fields and then the big Chantilly forest. Who sees the first horse?"},
   {t:"10:30",k:"sight",p:P.ecur,h:"Walk into town: racecourse & the Great Stables",tags:["free"],
    d:"From the station it's about 25 min on foot to the château (the town centre is about 1 km away). The route along Rue du Connétable passes the famous <b>racecourse</b> and the enormous <b>Grandes Écuries</b> (Great Stables). You'll come back inside them this afternoon. A taxi from the station rank takes about 5 min if the kids are tired.",
    tip:"Pavements are fine for the stroller. Carry snacks: the next proper meal is at 13:00.",
    story:`<p>Chantilly has been the capital of French horse racing since its racecourse opened in 1834. The town still has thousands of racehorses training in the surrounding forest; you may see riders on the sandy tracks.</p>`},
   {t:"11:15",k:"sight",p:P.chat,h:"Château de Chantilly",tags:["book"],
    d:"A Renaissance château rising out of a lake, with one of France's greatest art collections inside (the <b>Musée Condé</b>, second only to the Louvre for old paintings). Walk through the grand apartments, the picture galleries hung floor to ceiling, and the library. Plan on about 1½ hours, then go down to lunch, which is inside the château. Children under 7 get in free.",
    kids:"Count the <b>swans or ducks</b> in the moat around the castle. Inside, look for paintings with <b>horses</b> and <b>dogs</b>: the princes who lived here loved hunting.",
    tip:"Winter hours are château 10:00–17:00, park 10:00–18:00 and stables 12:00–17:00 (closed Tuesdays). One 'Domaine' ticket covers everything. Mid-November the Christmas decorations may be starting.",
    story:`<p><b>The Grand Condé.</b> In the 17th century this was the home of the Prince de Condé, a famous general and cousin of Louis XIV. In 1671 he threw a three-day feast here for the king, organised by his legendary steward <b>François Vatel</b>, and legend says that's where <b>whipped "Chantilly" cream</b> was born.</p>
    <p><b>Revolution and rebirth.</b> The Revolution confiscated the estate and the main castle was demolished. In the 1870s the Duc d'Aumale, son of France's last king, rebuilt it to house his art collection. In 1884 he left everything to the Institut de France on one condition: <b>nothing may ever be moved or lent</b>. That's why the paintings still hang exactly as he arranged them.</p>
    <p><b>World War I headquarters.</b> From late 1914 to 1916 Chantilly was the headquarters of the French army under General Joffre, and in 1915 the Allies held strategy conferences here.</p>`},
   {t:"13:00",k:"food",p:P.capi,h:"Lunch · La Capitainerie (booked)",tags:["book","kid"],
    d:"Your table for 5 is booked for <b>13:00</b>. The restaurant is inside the château, under the stone vaults of the 17th-century kitchens where Vatel cooked for the king. There's a huge open fireplace with meat roasting on the spit. Classic French food, a relaxed family atmosphere, and of course desserts with real <b>crème Chantilly</b>.",
    kids:"Find the <b>giant fireplace</b>. It's big enough to roast a whole sheep! Then order something with <b>crème Chantilly</b> for dessert.",
    tip:"Booking no. 1683270789 (TheFork). If you're running late, call the restaurant on +33 6 11 07 01 56 to keep your table.",
    story:`<p>The kitchens were built underground beside the moat so that food could be prepared out of sight of the guests. Vatel organised legendary feasts here. Whipped cream existed before him, but Chantilly made it famous, and it's been called <i>crème Chantilly</i> ever since.</p>`},
   {t:"14:30",k:"play",p:P.hameau,h:"The park: canals, gardens & the Hameau",tags:["kid","nap","free"],
    d:"A slow stroller loop for the toddler's nap. Walk the formal <b>French gardens</b> by Le Nôtre (the gardener who later designed Versailles) along the <b>Grand Canal</b>, then go to the <b>Hameau</b>, a little village of thatched cottages hidden in the woods. There's plenty of space for the 4½-year-old to run.",
    kids:"The Hameau was built as a <b>pretend village for princes</b> to play at being farmers. Find the cottage with a water wheel, and look for carp and ducks in the canals.",
    tip:"The park closes at about 18:00 in winter. The paths are gravel but fine for most strollers.",

function applyLang(){
  const T=I18N[LANG]; document.documentElement.lang=LANG==="sgs"?"sgs":LANG;
  if(T){
    const put=(dst,src)=>{ if(!src) return; for(const k of ["h","d","kids","tip","story","where"]) if(src[k]!==undefined&&src[k]!==null) dst[k]=src[k]; };
    for(const k of Object.keys(DAYS)) if(T.days&&T.days[k]){ const D=T.days[k];
      if(D.title) DAYS[k].title=D.title; if(D.blurb) DAYS[k].blurb=D.blurb; if(D.chips) DAYS[k].chips=D.chips;
      (D.stops||[]).forEach((x,j)=>put(DAYS[k].stops[j],x)); }
    (T.louvre||[]).forEach((x,j)=>put(LOUVRE[j],x));
    if(T.stk) for(const id in T.stk){ if(STK[id]){ if(T.stk[id].n) STK[id].n=T.stk[id].n; if(T.stk[id].m) STK[id].m=T.stk[id].m; } }
    (T.bingo||[]).forEach((x,i)=>{ if(BINGO[i]) BINGO[i][1]=x; });
    (T.levels||[]).forEach((x,i)=>{ if(LEVELS[i]) LEVELS[i][2]=x; });
    if(T.facts&&T.facts.length){ FACTS.length=0; T.facts.forEach(f=>FACTS.push(f)); }
    if(T.rules) for(const id in T.rules) if(RULES[id]) RULES[id].msg=T.rules[id];
  }
  document.getElementById("h1").innerHTML=t("title");
  document.getElementById("sub").innerHTML=t("sub");
  document.getElementById("footer").textContent=t("footer");
  document.getElementById("day-info").innerHTML=t("infoSat")+t("info");
  document.querySelectorAll("[data-ui]").forEach(e=>e.innerHTML=t(e.dataset.ui));
  document.getElementById("langs").innerHTML=LANGS.filter(l=>l[0]==="en"||I18N[l[0]]).map(l=>`<button class="lang${l[0]===LANG?" on":""}" data-lang="${l[0]}">${l[1]} ${l[2]}</button>`).join("");
}

  const W=640,H=250, lon0=2.278,lon1=2.408, lat0=48.840,lat1=48.868;
  const X=l=>((l-lon0)/(lon1-lon0))*W, Y=a=>H-((a-lat0)/(lat1-lat0))*H;
  const seine=[[2.276,48.848],[2.285,48.8545],[2.293,48.860],[2.302,48.8635],[2.315,48.8645],[2.327,48.8615],[2.338,48.8585],[2.347,48.8555],[2.355,48.8515],[2.363,48.847],[2.372,48.842],[2.380,48.838]];
  const pts=[]; stops.forEach(s=>{ if(!pts.length||pts[pts.length-1].p!==s.p) pts.push(s)});
  const path=seine.map((c,i)=>(i?"L":"M")+X(c[0]).toFixed(1)+","+Y(c[1]).toFixed(1)).join(" ");
  const route=pts.map((s,i)=>(i?"L":"M")+X(s.p.lon).toFixed(1)+","+Y(s.p.lat).toFixed(1)).join(" ");
  const col={sight:"#1f3a5f",food:"#c8423b",play:"#2f7d5b",move:"#8a8f9c",home:"#b98b2e"};
  let n=0, dots=""; const labelled=new Set();
  stops.forEach(s=>{ if(s.k==="move") return; if(s.k!=="home") n++; const x=X(s.p.lon),y=Y(s.p.lat);
    const off = labelled.has(s.p)? 1:0; labelled.add(s.p);
    dots+=`<a href="${navURL(s.p)}" target="_blank" rel="noopener"><circle cx="${x+off*14}" cy="${y-off*14}" r="10" fill="${col[s.k]}" stroke="#fff" stroke-width="2"/><text x="${x+off*14}" y="${y-off*14+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Inter">${s.k==="home"?"⌂":n}</text></a>`;
  });
  return `<svg viewBox="-12 -12 ${W+24} ${H+24}" role="img" aria-label="Schematic map of the day">
  <rect x="-12" y="-12" width="${W+24}" height="${H+24}" rx="12" fill="#f4efe5"/>
  <path d="${path}" fill="none" stroke="#a9c6e0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="${X(2.318)}" y="${Y(48.8668)}" font-size="11" fill="#6b8fb3" font-style="italic" font-family="Inter">la Seine</text>
  <path d="${route}" fill="none" stroke="#1d2433" stroke-width="1.6" stroke-dasharray="4 4" opacity=".55"/>
  ${dots}</svg>`;
}

function cardInner(s, id, done, buttons, head){
  const tags=(s.tags||[]).map(t=>`<span class="tag ${t}">${TAGS[t]}</span>`).join("");
  return `<div class="card">
    ${head!==undefined?head:`<label class="done-toggle"><input type="checkbox" ${done?"checked":""}> ${t("done")}</label><div class="time">${s.t}</div>`}
    <h3>${STK[id]?STK[id].e+" ":""}${s.h}</h3>
    ${s.where?`<div class="where">📍 ${s.where}</div>`:""}
    ${tags?`<div>${tags}</div>`:""}
    <p>${s.d}</p>
    ${s.kids?`<div class="kids">🧒 ${s.kids}</div>`:""}
    ${s.tip?`<div class="tip">💡 ${s.tip}</div>`:""}
    ${s.story?`<details class="story"><summary>${t("history")}</summary>${s.story}</details>`:""}
    ${STK[id]?stkBtn(id):""}

}

function bindChecks(el){
  el.querySelectorAll(".stop input").forEach(cb=>cb.addEventListener("change",e=>{
    const li=e.target.closest(".stop"); li.classList.toggle("done",e.target.checked);
    store("done-"+li.dataset.id, e.target.checked?"1":"0");
  }));
}

/* ---------- live timing ---------- */
const DAYDATE={thu:"2026-11-12",fri:"2026-11-13",sat:"2026-11-14"};
const RULES={
 "thu-3":{notBefore:"11:45"},
 "thu-4":{endBy:"17:00",msg:"The Luxembourg Gardens close at about 17:00 in November. Shorten the visit or skip it."},
 "thu-6":{startBy:"17:05",msg:"It'll be getting dark. A night photo still works, and the tower sparkles on the hour."},
 "thu-7":{startBy:"19:00",msg:"Getting late for the cruise. Check the last sightseeing departure at the pier."},
 "thu-9":{notBefore:"19:30"},
 "fri-1":{notBefore:"10:00",startBy:"10:30",msg:"Your Louvre ticket is for 10:00."},
 "fri-2":{notBefore:"11:45"},
 "fri-6":{startBy:"16:45",msg:"Père Lachaise closes at 17:30, so there's little time left. Consider skipping it and going home early."},
 "fri-8":{notBefore:"19:00"},
 "sat-4":{endBy:"17:00",msg:"The château closes at 17:00 in winter."},
 "sat-5":{notBefore:"13:00",startBy:"13:15",msg:"Your table at La Capitainerie is at 13:00. If you're late, call +33 6 11 07 01 56."},
 "sat-6":{endBy:"18:00",msg:"The park closes at about 18:00 in winter."},
 "sat-7":{startBy:"16:15",endBy:"17:00",msg:"The Great Stables close at 17:00 in winter, so go now or skip."}
};
const toMin=t=>{const [h,m]=t.split(":").map(Number);return h*60+m;};
const fmt=m=>{m=Math.round(m);return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(((m%60)+60)%60).padStart(2,"0");};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;};
const todayStr=()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");};
const tget=(k)=>{const v=store(k);return v===null||v===""||v===undefined?null:Number(v);};

function computeDay(key){
  const st=DAYS[key].stops, live=todayStr()===DAYDATE[key], now=nowMin();
  const P=st.map(s=>toMin(s.t)), out=[];
  let cur=null, lastRec=-1, liveDone=false;
  st.forEach((s,j)=>{ const id=key+"-"+j; if(tget("arr-"+id)!==null||tget("done-t-"+id)!==null||store("skip-"+id)==="1") lastRec=j; });
  st.forEach((s,j)=>{
    const id=key+"-"+j, R=RULES[id]||{};
    const dur = j<st.length-1 ? P[j+1]-P[j] : 75;
    const arr=tget("arr-"+id), dn=tget("done-t-"+id), sk=OFF.has(id)||store("skip-"+id)==="1";
    let start = arr!==null ? arr : (cur===null ? P[j] : cur);
    if(arr===null && R.notBefore) start=Math.max(start,toMin(R.notBefore));
    let state = sk?"skip": dn!==null?"done": arr!==null?"here": (j<lastRec?"passed":"todo");
    if(live && !liveDone && (state==="todo"||state==="here")){ if(state==="todo") start=Math.max(start,now); liveDone=true; }
    let end;
    if(sk) end=start;
    else if(dn!==null) end=dn;
    else if(state==="here" && live) end=Math.max(start+dur, now);
    else end=start+dur;
    let warn=null;
    if(!sk && state!=="done" && state!=="passed"){
      if(R.startBy && start>toMin(R.startBy)+0.5) warn=R.msg;
      if(R.endBy && end>toMin(R.endBy)+0.5) warn=R.msg;
    }
    out.push({start,end,plan:P[j],arr,dn,sk,state,warn});
    cur=end;
  });
  return out;
}

function timeHead(key,j,s,T){
  const id=key+"-"+j, delta=Math.round(T.start-T.plan);
  let tt;
  if(T.state==="skip") tt=`<s>${s.t}</s> <span class="skipped">${t("skipped")}</span>`;
  else if(T.state==="done") tt=`${fmt(T.arr!==null?T.arr:T.start)}–${fmt(T.dn)} <span class="ok">${t("doneT")}</span>`;
  else if(T.state==="here") tt=UI_t("arrivedAt",{t:fmt(T.arr)});
  else if(T.state==="passed") tt=`<s>${s.t}</s>`;
  else if(Math.abs(delta)>=5) tt=`~${fmt(T.start)} <s class="plan">${s.t}</s> <span class="${delta>0?"late":"early"}">${delta>0?"+":"−"}${Math.abs(delta)} ${UI_t("min")}</span>`;
  else tt=s.t;
  let btns="";
  if(s.k!=="move"){
    const first=j===0&&s.k==="home";
    if(T.state==="skip") btns=`<button class="tbtn" data-act="skip" data-id="${id}">${UI_t("undoSkip")}</button>`;
    else if(first) btns = T.dn!==null ? `<button class="tbtn on" data-act="edit-done" data-id="${id}">${UI_t("leftAt",{t:fmt(T.dn)})}</button>` : `<button class="tbtn go" data-act="done" data-id="${id}">${UI_t("weLeft")}</button>`;
    else{
      btns += T.arr!==null ? `<button class="tbtn on" data-act="edit-arr" data-id="${id}">📍 ${fmt(T.arr)} ✎</button>` : `<button class="tbtn go" data-act="arr" data-id="${id}">${UI_t("arrived")}</button>`;
      btns += T.dn!==null ? `<button class="tbtn on" data-act="edit-done" data-id="${id}">✓ ${fmt(T.dn)} ✎</button>` : `<button class="tbtn" data-act="done" data-id="${id}">${UI_t("doneBtn")}</button>`;
      if(T.state!=="done") btns += `<button class="tbtn ghost" data-act="skip" data-id="${id}">${UI_t("skip")}</button>`;
    }
  }
  return `<div class="time">${tt}</div>${btns?`<div class="tbtns">${btns}</div>`:""}${T.warn?`<div class="warn">⚠️ ${T.warn}</div>`:""}`;
}

function render(key){
  const D=DAYS[key], el=document.getElementById("day-"+key);
  el.innerHTML=`<div class="summary"><h2>${D.title}</h2><p>${D.blurb}</p>
    <div class="chips">${D.chips.map(c=>`<span class="chip">${c}</span>`).join("")}</div>
    <div class="btnrow"><a class="btn primary" href="${dayURL(D.stops,key)}" target="_blank" rel="noopener">${ICON_PIN} ${t("wholeDay")}</a></div></div>
    <div class="map"><div class="lmap" id="lmap-${key}">${window.L?"":mapSVG(D.stops)}${window.L?'<button class="locate" data-locate="'+key+'">'+t("whereAmI")+'</button>':""}</div><div class="cap">${t("mapCap")}</div></div>
    <div class="banner" id="bn-${key}"></div>
    <ol class="timeline" id="tl-${key}"></ol>`;
  renderTimeline(key);
}

function renderTimeline(key){
  const D=DAYS[key], T=computeDay(key), tl=document.getElementById("tl-"+key); if(!tl) return;
  let n=0, nextJ=-1;
  T.forEach((x,j)=>{ if(nextJ<0 && !OFF.has(key+"-"+j) && D.stops[j].k!=="move" && (x.state==="todo"||x.state==="here")) nextJ=j; });
  tl.innerHTML=D.stops.map((s,i)=>{
    if(OFF.has(key+"-"+i)) return "";
    const label = s.k==="move" ? "→" : (s.k==="home"?"⌂":++n);
    const id=key+"-"+i, x=T[i];
    const cls=(x.state==="done"||x.state==="passed")?" done":x.state==="skip"?" skip":"";
    const buttons=`<div class="btnrow">
      <a class="btn primary" href="${navURL(s.p)}" target="_blank" rel="noopener">${ICON_NAV} ${t("directions")}</a>
      <a class="btn" href="${placeURL(s.p)}" target="_blank" rel="noopener">${ICON_PIN} ${t("map")}</a>
      ${s.louvre?`<button class="btn gold" data-goto="louvre">${t("louvreGuide")}</button>`:""}
    </div>`;
    return `<li class="stop ${s.k}${cls}${i===nextJ?" now":""}" data-id="${id}"><div class="dot">${label}</div>${cardInner(s,id,false,buttons,timeHead(key,i,s,x))}</li>`;
  }).join("");
  // banner
  const bn=document.getElementById("bn-"+key), any=T.some(x=>x.arr!==null||x.dn!==null||x.sk), live=todayStr()===DAYDATE[key];
  if(!any && !live){ bn.innerHTML=""; return; }
  const last=T[T.length-1], warns=T.map((x,j)=>x.warn?`<li>${D.stops[j].h}: ${x.warn}</li>`:"").join("");
  let msg;
  if(nextJ<0) msg=t("allDone");
  else{
    const d=Math.round(T[nextJ].start-T[nextJ].plan), nx=D.stops[nextJ];
    const status = d>=10?t("behind",{d:d}): d<=-10?t("ahead",{d:-d}):t("onTime");
    msg=`${status}<br>${t("next")}: <b>${nx.h}</b> ~${fmt(T[nextJ].start)} · ${t("lastStop")} ~${fmt(last.start)}${d>=20?`<br><small>${t("tipSkip")}</small>`:""}`;
  }
  bn.innerHTML=`<div class="bn ${warns?"bad":""}">${msg}${warns?`<ul>${warns}</ul>`:""}<div style="text-align:right"><button class="reset" data-reset="${key}">${t("resetT")}</button></div></div>`;
}

function setT(k,v){ store(k, v===null?"":String(v)); }
function askTime(label,cur){
  let v; try{ v=prompt(label+" "+t("askHint"), fmt(cur)); }catch(e){ return undefined; }
  if(v===null) return undefined; v=v.trim(); if(v==="") return null;
  const m=v.match(/^(\d{1,2})[:.h]?(\d{2})$/); if(!m) return undefined; return Number(m[1])*60+Number(m[2]);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"), r=e.target.closest("[data-reset]");
  if(r){ const key=r.dataset.reset;
    if(!r.dataset.sure){ r.dataset.sure=1; r.textContent=t("resetTSure"); return; }
    DAYS[key].stops.forEach((s,j)=>{const id=key+"-"+j; setT("arr-"+id,null); setT("done-t-"+id,null); store("skip-"+id,"0");});
    renderTimeline(key); return; }
  if(!b) return;
  const id=b.dataset.id, key=id.split("-")[0], act=b.dataset.act, now=Math.round(nowMin());
  if(act==="arr") setT("arr-"+id, now);
  else if(act==="done"){ setT("done-t-"+id, now); if(STK[id] && store("stk-"+id)!=="1") setTimeout(()=>openMission(id),250); }
  else if(act==="skip") store("skip-"+id, store("skip-"+id)==="1"?"0":"1");
  else if(act==="edit-arr"){ const v=askTime(t("askArr"), tget("arr-"+id)); if(v!==undefined) setT("arr-"+id,v); }
  else if(act==="edit-done"){ const v=askTime(t("askDone"), tget("done-t-"+id)); if(v!==undefined) setT("done-t-"+id,v); }
  renderTimeline(key);
});
setInterval(()=>{ ["thu","fri","sat"].forEach(k=>{ if(todayStr()===DAYDATE[k]) renderTimeline(k); }); },60000);

function renderLouvre(){
  const el=document.getElementById("day-louvre");

    const id="louvre-"+i, done=store("done-"+id)==="1";

    return `<li class="stop ${s.k}${done?" done":""}" data-id="${id}" data-t="${s.t}"><div class="dot">${label}</div>${cardInner(s,id,done)}</li>`;

    <div class="floors">
      <div><b>Sully</b>${t("louSully")}</div>
      <div><b>Denon</b>${t("louDenon")}</div>
      <div><b>Richelieu</b>${t("louRich")}</div>

const MAPS={};
const PINCOL={sight:"#1f3a5f",food:"#c8423b",play:"#2f7d5b",home:"#b98b2e"};
function initMap(key){
  if(!window.L||MAPS[key]) return;
  const el=document.getElementById("lmap-"+key); if(!el||!el.offsetWidth) return;
  const m=L.map(el,{zoomControl:true,attributionControl:true,zoomSnap:0.25});
  const OSM_ATTR='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
  const sources=[
    ["https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:OSM_ATTR}],
    ["https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png",{maxZoom:19,subdomains:"abc",attribution:OSM_ATTR+' · OSM France'}]
  ];
  let si=0, errs=0, layer;
  const useSource=i=>{ if(layer) m.removeLayer(layer); errs=0;
    layer=L.tileLayer(sources[i][0],sources[i][1]).addTo(m);
    layer.on("tileerror",()=>{ if(++errs>=3 && si<sources.length-1){ si++; useSource(si);} });
  };
  m.attributionControl.setPrefix(false);
  useSource(0);
  const pts=[]; let n=0; const seen=new Map();
  DAYS[key].stops.forEach((s,j)=>{
    if(OFF.has(key+"-"+j)) return;
    if(s.k==="move") return; if(s.k!=="home") n++;
    const lbl=s.k==="home"?"⌂":n;
    if(seen.has(s.p)){ seen.get(s.p).push(lbl+" · "+s.h); return; }
    const list=[lbl+" · "+s.h]; seen.set(s.p,list);
    const icon=L.divIcon({className:"",html:`<div class="pin" style="background:${PINCOL[s.k]}"><span>${lbl}</span></div>`,iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-28]});
    L.marker([s.p.lat,s.p.lon],{icon}).addTo(m).bindPopup(()=>`<b>${list.join("<br>")}</b><a class="pop-btn" href="${navURL(s.p)}" target="_blank" rel="noopener">${t("directions")}</a><a class="pop-btn" style="background:#fff;color:#1f3a5f!important;border:1px solid #1f3a5f" href="${placeURL(s.p)}" target="_blank" rel="noopener">${t("map")}</a>`);
    pts.push([s.p.lat,s.p.lon]);
  });
  L.polyline(pts,{color:"#1d2433",weight:2,opacity:.5,dashArray:"5 6"}).addTo(m);
  const fit = key==="sat" ? pts.filter(q=>q[0]>49) : pts;
  m.fitBounds(fit,{padding:[30,30]});
  m._pts=fit;
  MAPS[key]=m;
  setTimeout(()=>{m.invalidateSize();m.fitBounds(fit,{padding:[30,30]});},300);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-locate]"); if(!b) return;
  const m=MAPS[b.dataset.locate]; if(!m||!navigator.geolocation) return;
  b.textContent=t("locating");
  navigator.geolocation.getCurrentPosition(pos=>{
    const ll=[pos.coords.latitude,pos.coords.longitude];
    if(m._me) m._me.setLatLng(ll); else m._me=L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]})}).addTo(m);
    m.setView(ll,15); b.textContent=t("whereAmI");
  },()=>{b.textContent=t("locBlocked");},{enableHighAccuracy:true,timeout:10000});
});


function show(key){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.day===key));
  document.querySelectorAll(".day").forEach(d=>d.classList.toggle("on", d.id==="day-"+key));
  if(key==="stickers") renderStickers();
  updTab();
  if(DAYS[key]){ initMap(key); if(MAPS[key]) setTimeout(()=>MAPS[key].invalidateSize(),50); }
  if(location.hash!=="#"+key) history.replaceState(null,"","#"+key);
  window.scrollTo({top:0});
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>show(b.dataset.day)));
document.addEventListener("click",e=>{const g=e.target.closest("[data-goto]"); if(g) show(g.dataset.goto);});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(document.getElementById("day-"+h)) show(h);});

(function(){
  const h=location.hash.slice(1);
  const now=new Date(); const ds=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
  const key = document.getElementById("day-"+h) ? h : (ds==="2026-11-13" ? "fri" : ds==="2026-11-14" ? "sat" : "thu");
  show(key);
})();
</script>
